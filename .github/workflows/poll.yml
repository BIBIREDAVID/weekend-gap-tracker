name: Poll RWA prices

on:
  schedule:
    # Every 15 minutes, all day, every day (the whole point is coverage
    # through the weekend). GitHub Actions cron is best-effort, not exact.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  poll:
    # GitHub's own ubuntu-latest hosted runners are geo-blocked by Binance
    # for this product (confirmed live: code 40304 "Service not available
    # due to compliance restriction" — GitHub's hosted runners run in US
    # datacenters, and Ondo's tokenized stocks are explicitly restricted
    # from the US; see NOTES.md). Runs on a self-hosted runner instead —
    # register one from this repo's Settings > Actions > Runners, using the
    # same machine/network that already works.
    runs-on: self-hosted
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: node scripts/run-poll.js
        env:
          OC_API_KEY: ${{ secrets.OC_API_KEY }}
          OC_SECRET_KEY: ${{ secrets.OC_SECRET_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          # Optional — public wallet address, not a secret, but repo
          # secrets are the simplest place to keep it alongside the rest.
          # Set it to enable the dashboard's wallet balance panel.
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
